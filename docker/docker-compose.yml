# =====================================================================
# Noesis — One-command local deployment
# =====================================================================
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   curl http://localhost:8000/health
#
# Services:
#   • backend — FastAPI on :8000
#   • qdrant  — Vector DB on :6333 (REST) / :6334 (gRPC)
#   • redis   — Cache / broker on :6379
#
# Persistent volumes:
#   noesis_qdrant — Qdrant vectors
#   noesis_data   — Backend SQLite + uploaded RAG documents
#
# Networks:
#   noesis        — Internal bridge; backend talks to qdrant/redis over it.
# =====================================================================

name: astraos

services:

  # ------------------------------------------------------------------
  # Backend — FastAPI + Uvicorn
  # ------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: astraos-backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////app/data/noesis.db
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - astraos_data:/app/data
      - astraos_uploads:/app/uploads
    networks:
      - astraos
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/livez"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: "2.0"

  # ------------------------------------------------------------------
  # Qdrant — Vector database
  # ------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: astraos-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - astraos_qdrant:/qdrant/storage
    networks:
      - astraos
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 2g
    cpus: "2.0"

  # ------------------------------------------------------------------
  # Redis — Cache / Broker
  # ------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: astraos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - astraos_redis:/data
    networks:
      - astraos
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    cpus: "1.0"

networks:
  astraos:
    driver: bridge

volumes:
  astraos_qdrant:
    name: astraos_qdrant
  astraos_redis:
    name: astraos_redis
  astraos_data:
    name: astraos_data
  astraos_uploads:
    name: astraos_uploads
