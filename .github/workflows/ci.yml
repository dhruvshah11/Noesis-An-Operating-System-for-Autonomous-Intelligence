name: Noesis CI

# -----------------------------------------------------------------------------
# Milestone 0 pipeline:
#   • Lint (ruff)
#   • Type-check (mypy, strict)
#   • Unit tests (pytest) + coverage with fail-under threshold
#
# Runs on every push + every PR to main.
# Integration tests (requiring Qdrant/Redis) are excluded via markers until
# a service matrix is introduced in Milestone 2+.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "docker/**"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "docker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project + dev deps
        run: uv sync --group dev --no-cache 2>/dev/null || (
          uv venv --python $PYTHON_VERSION .venv &&
          uv pip install --python .venv/bin/python -e ".[dev]"
        )

      - name: Ruff (format check + lint)
        run: |
          source .venv/bin/activate 2>/dev/null || true
          ruff format --check .
          ruff check .

      - name: mypy (strict type-check)
        run: |
          source .venv/bin/activate 2>/dev/null || true
          mypy --config-file pyproject.toml noesis

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev deps
        shell: bash
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]" || \
          uv pip install --python .venv/Scripts/python.exe -e ".[dev]" || true

      - name: Run unit tests with coverage
        shell: bash
        env:
          SECRET_KEY: ci-test-secret-0000000000000000000000000000
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          OLLAMA_BASE_URL: http://localhost:11434
          LLM_DEFAULT_PROVIDER: ollama
        run: |
          source .venv/bin/activate 2>/dev/null || .venv/Scripts/activate 2>/dev/null || true
          pytest tests/unit \
            -m "unit or not (integration or e2e or slow)" \
            --strict-markers \
            --cov=noesis \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=50

      - name: Upload coverage (ubuntu + 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  # ---------------------------------------------------------------------------
  # Frontend regression jobs (M6 hardening) — run independently from backend
  # lanes so a frontend PR doesn't have to wait on lint/mypy, and a backend
  # PR doesn't wait on Node toolchains.  4 gates matching the M5 acceptance:
  #   (1) tsc --noEmit
  #   (2) eslint --max-warnings 0
  #   (3) vitest run
  #   (4) next build
  # ---------------------------------------------------------------------------
  frontend-lint-typecheck:
    name: Frontend · tsc + eslint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps (npm ci when lockfile exists else npm install)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck

      - name: ESLint (0 warnings)
        run: npm run lint

  frontend-tests-and-build:
    name: Frontend · vitest + next build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Vitest unit tests (run)
        env:
          NEXT_PUBLIC_API_BASE: "http://127.0.0.1:8000"
          NEXT_PUBLIC_APP_ENV: "test"
          NODE_ENV: "test"
        run: npm test -- --run --reporter=default

      - name: Next.js production build (12/12 pages prerender baseline)
        env:
          NEXT_PUBLIC_API_BASE: "http://127.0.0.1:8000"
          NEXT_PUBLIC_APP_ENV: "production"
        run: npm run build

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: noesis-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
