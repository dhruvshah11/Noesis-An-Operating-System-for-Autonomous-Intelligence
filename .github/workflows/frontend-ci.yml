name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  typecheck-lint-test:
    name: tsc + eslint + vitest + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps (ci)
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint (0 warnings gate)
        run: npx eslint . --max-warnings=0
      - name: Vitest run
        run: npx vitest run --reporter=verbose
      - name: Axe a11y audit (0 CRITICAL gate)
        run: node scripts/axe_audit.mjs
