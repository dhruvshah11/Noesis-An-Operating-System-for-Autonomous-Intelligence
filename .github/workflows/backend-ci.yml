name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Ruff (format + check)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install hatch
        run: python -m pip install --upgrade pip hatch
      - name: Ruff check
        run: hatch run ruff check . -q
      - name: Ruff format --check
        run: hatch run ruff format --check .

  unit-tests:
    name: Unit tests (claim-suites)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install hatch
        run: python -m pip install --upgrade pip hatch
      - name: Run claim-suites (C1/C2/C3 + types + llm + plugins + tristate)
        run: >
          hatch -e test run pytest
          tests/unit/test_determinism_manifest.py
          tests/unit/test_memory_promotion.py
          tests/unit/test_memory_promotion_wiring.py
          tests/unit/test_llm_factory_audit.py
          tests/unit/test_executor_tristate.py
          tests/unit/test_types.py
          tests/unit/test_llm_provider.py
          tests/unit/test_plugins_cli.py
          tests/unit/test_bench_stats.py
          -v --tb=short

  build-wheel:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build dist
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: noesis-dist
          path: |
            backend/dist/*.whl
            backend/dist/*.tar.gz
          retention-days: 30
