---
# Dependabot version updates for Noesis.
# Runs weekly on Monday at 06:00 UTC.  Groups related dependency updates
# into single PRs to reduce noise.

version: 2
updates:
  # --- Python backend (pip / pyproject.toml via pip-compatible ecosystem)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 12
    labels: ["dependencies", "triage"]
    assignees: ["astraos/core"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      llm-providers:
        patterns:
          - "openai"
          - "anthropic"
          - "google-generativeai"
          - "langchain*"
          - "langgraph"
          - "qdrant-client"
          - "redis"
        update-types: ["minor", "patch"]
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "httpx"
          - "starlette"
          - "pydantic*"
        update-types: ["minor", "patch"]
      db-stack:
        patterns:
          - "sqlalchemy"
          - "aiosqlite"
        update-types: ["minor", "patch"]
      dev-tools:
        dependency-type: "development"
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "faker"
          - "factory-boy"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "ci", "triage"]
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      gh-actions:
        patterns:
          - "actions/*"
          - "docker/*"
          - "astral-sh/*"
          - "anchore/*"

  # --- Docker base images (future: when Dockerfile lives here, future-proof)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 4
    labels: ["dependencies", "docker", "triage"]
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
