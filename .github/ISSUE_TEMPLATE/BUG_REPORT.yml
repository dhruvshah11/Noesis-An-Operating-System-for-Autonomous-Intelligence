---
name: Bug Report
description: Report something broken in Noesis
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Good reports include reproduction steps, environment details, and expected vs actual behavior.

  - type: checkboxes
    id: searched
    attributes:
      label: Confirmation
      options:
        - label: I have searched for [existing issues](https://github.com/noesis/noesis/issues) and this is not a duplicate.
          required: true
        - label: I have read the [Troubleshooting docs](README.md#faq) and this is not a known issue.
          required: true
        - label: This bug occurs on the latest `main` branch.
          required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of what you observed vs what you expected. Paste screenshots if UI-related.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered list of commands / UI clicks. Include exact curl commands or Python snippets where possible.
      placeholder: |
        1. `cd backend && cp .env.example .env` (set OPENAI_API_KEY=…)
        2. `uvicorn noesis.api.main:app --reload`
        3. `curl -X POST http://localhost:8000/v1/chat …`
    validations:
      required: true

  - type: input
    id: noesis_version
    attributes:
      label: Noesis version / commit
      description: Output of `git rev-parse HEAD` or release tag.
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: Deployment type
      options:
        - Bare-metal (uvicorn)
        - Docker Compose
        - Kubernetes
        - Cloud PaaS (Railway / Render / Fly / etc.)
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Python version, OS, database backend (SQLite/Postgres), LLM provider used, browser (if frontend).
      value: |
        - `python --version`:
        - OS:
        - DATABASE_URL backend (SQLite/Postgres):
        - Default LLM provider:
        - Any other relevant details:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / traceback
      description: Paste full stack traces. Use ` ``` ` fences for formatting.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional notes
      description: Workarounds you've tried, related issues, etc.
