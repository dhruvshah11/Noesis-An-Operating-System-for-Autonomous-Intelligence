[project]
name = "noesis"
version = "0.1.0"
description = "Noesis - An Operating System for Autonomous Intelligence"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Noesis Contributors" },
]
keywords = ["ai", "agents", "multi-agent", "llm", "langgraph", "rag", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "anthropic>=0.125.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "qdrant-client>=1.11.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "markdownify>=0.13.0",
    "beautifulsoup4>=4.12.0",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "orjson>=3.10.0",
    "python-multipart>=0.0.9",
    "typer>=0.15.0",
    "alembic>=1.13.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "faker>=30.0.0",
    "factory-boy>=3.3.0",
    "httpx>=0.27.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
security = [
    "syft",
    "trivy",
]

[project.scripts]
noesis = "noesis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noesis"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pyflakes, pycodestyle
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # flake8-bugbear
    "PLE", "PLR", "PLW", # pylint
    "SIM",               # flake8-simplify
    "TCH",               # flake8-type-checking
    "RUF",               # ruff-specific
]
ignore = [
    # Complexity — structural decisions (args / branches / lines / returns)
    "PLR0913", "PLR0915", "PLR0912", "PLR0911", "PLR0917",
    # pydantic deprecated aliases — `from __future__ import annotations` still fine
    "PLE2502",
    # Function default args: kept mutable by design (DI container factory defaults)
    "B008",
    # -----------------------------------------------------------------------
    # Baseline style debt carried forward from M0–M5.  These are NOT bugs —
    # they are cosmetic / stylistic preferences.  Fixing in bulk would
    # churn 154 call sites without functional benefit.  Tackle per-file as
    # each module is touched during feature work instead.
    # -----------------------------------------------------------------------
    # 154x "magic number" comparisons (test case constants, code numbers etc.)
    "PLR2004",
    # Naming conventions (CAPS locals, camelcase imports, no Error suffix)
    "N806", "N814", "N818",
    # 5x global statement (singleton config / observability initialisers —
    # kept by design to avoid threading through 17 parameters)
    "PLW0603",
    # Module-level import not at top: 10 intentional deferrals to break
    # circular-import chains in kernel_services / DI bootstrap
    "E402",
    # PEP 695 type aliases / StrEnum vs (str, Enum) class — cosmetic only
    "UP042", "UP046", "UP047",
    # Ambiguous unicode dashes / quotes in docstrings: look fine to humans,
    # only flag because ruff prefers ASCII hyphens
    "RUF001", "RUF002", "RUF003",
    # Flake8-simplify "could collapse if / suppressible except / ternary-else"
    # suggestions — current form reads better in the affected 6 spots.
    "SIM102", "SIM105",
    # 1x `str in dict.keys()` — equivalent to `str in dict`, legacy, harmless
    "SIM118",
    # 1x `zip()` without strict= — existing behaviour is correct for 2
    # unequally-lengthed iterables where we want shortest-iter semantics.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Corpus generator contains 50 long-form task strings in dataclass literals.
# Line-length is structural content, not logic — ignore E501/W505 to keep
# each task's natural-language text on 1 line per column (readable grep).
"scripts/build_noesis_se50.py" = [
    "E501",
    "W505",
]
# Pre-existing benchmark harnesses carry structural ruff debt.  They are
# evaluation harnesses, not production code — their long-form dataclass
# string literals + multi-import preambles mirror the style used in
# build_noesis_se50.py.  Fixing in bulk would churn 400+ lines of
# intentionally-stable test corpus scaffolding with no functional benefit.
"scripts/bench_humaneval.py" = [
    "I001",
    "F401",
    "UP015",
    "PLW2901",
    "F541",
    "PLW1510",
    "E402",
    "SIM105",
]
"scripts/bench_mbpp.py" = [
    "I001",
    "F401",
    "E501",
    "W505",
    "UP015",
    "PLW1510",
    "E402",
    "SIM105",
]
"scripts/bench_se50_batch.py" = [
    "I001",
    "F401",
    "UP015",
    "F841",
    "SIM105",
    "E402",
    "PLR0915",
]

[tool.ruff.lint.isort]
known-first-party = ["noesis", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
strict_equality = true
explicit_package_bases = true
namespace_packages = false
show_error_codes = true
show_column_numbers = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=noesis --cov-report=term-missing --cov-fail-under=40"
markers = [
    "unit: Unit tests - fast, no external services",
    "integration: Integration tests - require databases, APIs, etc.",
    "e2e: End-to-end tests - full system",
    "slow: Slow tests",
    "claim_suite: Security claim-suite tests — formal MAC/DAC capability-gate assertions",
    "C1: Claim C1 — Mandatory Access Control (MAC) capability gates",
    "MAC: Mandatory Access Control (MAC) capability-gate pattern tests",
]

[tool.coverage.run]
source = ["noesis"]
omit = [
    "*/tests/*",
    "noesis/cli.py",
    "noesis/core/*",
    "noesis/llm/_retry.py",
    "noesis/llm/parse.py",
    "noesis/llm/prompts.py",
]

[tool.coverage.report]
# Modules that ship but are exercised by integration / smoke tests (not unit)
# are excluded from the strict unit-test coverage threshold.
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*Protocol",
]
