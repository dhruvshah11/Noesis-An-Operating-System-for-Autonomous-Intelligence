---
# Pre-commit hooks — run on every local commit to catch lint/format issues
# BEFORE they hit CI.  Install once:
#
#     pip install pre-commit
#     pre-commit install        # hooks into git
#     pre-commit install --hook-type commit-msg  # for commitlint (future)
#
# Hooks listed below run on changed files only.
# See: https://pre-commit.com/hooks.html

repos:
  # --- Meta / housekeeping ---------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: pretty-format-json
        args: ["--autofix", "--indent=2", "--no-sort-keys"]

  # --- Bandit (static security linter for Python)
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: bandit (security scan)
        args: ["--recursive", "backend/noesis", "-c", "pyproject.toml", "-lll"]
        pass_filenames: false
        additional_dependencies: ["bandit[toml]>=1.7.10"]

  # --- Python code quality: Ruff (lint + format, replaces flake8/isort/black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: ruff lint
        types_or: [python, pyi]
        args: ["--fix"]
      - id: ruff-format
        name: ruff format
        types_or: [python, pyi]

  # --- Strict mypy (cache keyed to repo, runs on python changes)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (strict)
        alias: mypy-strict
        entry: mypy
        language: system
        pass_filenames: false
        args: ["--config-file", "backend/pyproject.toml", "backend/noesis"]
        additional_dependencies:
          - "pydantic>=2.9.0"
          - "sqlalchemy>=2.0.35"
          - "fastapi>=0.115.0"
          - "httpx>=0.27.0"
          - "redis>=5.0.0"

  # --- Conventional commit message linting (enforce feat/fix/chore prefix)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # --- Mermaid / Markdown (docs) --------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        language: node
        types: [markdown]
        args:
          - "--disable"
          - "MD013"  # Line length — let Prettier/editor handle
          - "MD041"  # First line in file must be H1 (we allow <div> hero banners)
